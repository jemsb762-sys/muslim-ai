<!DOCTYPE html>
<html lang="am" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Muslim AI | إسلامي AI</title>

  <meta
    name="description"
    content="Muslim AI - Islamic assistant in Amharic, Afaan Oromoo and Arabic."
  >

  <meta name="theme-color" content="#063b2b">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

  <div class="bismillah">
    بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
  </div>

  <h1>Muslim AI</h1>

  <p id="subtitle" class="subtitle">
    እስላማዊ AI በአማርኛ፣ አፋን ኦሮሞ እና ዐረብኛ
  </p>

  <div class="languages">

    <button
      class="lang-btn active"
      data-lang="am"
      type="button">
      አማርኛ
    </button>

    <button
      class="lang-btn"
      data-lang="om"
      type="button">
      Afaan Oromoo
    </button>

    <button
      class="lang-btn"
      data-lang="ar"
      type="button">
      العربية
    </button>

  </div>

</header>


<main class="chat-container">

  <section
    id="messages"
    class="messages"
    aria-live="polite">

    <div
      id="welcome"
      class="message bot">
      አስላሙ አለይኩም! እኔ Muslim AI ነኝ።
      የእስልምና ጥያቄዎን ይጠይቁኝ።
    </div>

  </section>


  <div class="input-area">

    <input
      id="userInput"
      type="text"
      maxlength="4000"
      autocomplete="off"
      placeholder="ጥያቄዎን ይጻፉ..."
    >

    <button
      id="sendBtn"
      type="button">
      ላክ
    </button>

  </div>

</main>


<footer>
  Muslim AI — Made for the Ummah ❤️
</footer>


<script src="app.js"></script>

</body>
</html>
