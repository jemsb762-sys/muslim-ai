<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muslim AI | እስላማዊ AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f3d2e, #1a5c40);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.2);
        }
        .bismillah {
            font-size: 1.3rem;
            color: #e8d5a3;
            margin-bottom: 8px;
        }
        h1 { font-size: 1.8rem; color: #f0e6d2; }
        .subtitle { font-size: 0.95rem; opacity: 0.85; margin-top: 5px; }
        .languages {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .lang-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            padding: 8px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .lang-btn.active {
            background: #2e7d5a;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            margin-bottom: 15px;
            min-height: 300px;
        }
        .message {
            margin-bottom: 12px;
            padding: 12px 16px;
            border-radius: 15px;
            max-width: 85%;
            line-height: 1.5;
        }
        .bot {
            background: rgba(46,125,90,0.4);
            align-self: flex-start;
        }
        .user {
            background: rgba(255,255,255,0.15);
            margin-left: auto;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        #userInput {
            flex: 1;
            padding: 14px 18px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            background: rgba(255,255,255,0.9);
            color: #222;
        }
        #sendBtn {
            background: #2e7d5a;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
        }
        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.85rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <header>
        <div class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
        <h1>Muslim AI</h1>
        <p class="subtitle" id="subtitle">እስላማዊ AI በአማርኛ፣ አፋን ኦሮሞ እና ዐረብኛ</p>
        
        <div class="languages">
            <button class="lang-btn active" onclick="changeLang('am')">አማርኛ</button>
            <button class="lang-btn" onclick="changeLang('om')">Afaan Oromo</button>
            <button class="lang-btn" onclick="changeLang('ar')">العربية</button>
        </div>
    </header>

    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="message bot" id="welcome">
                አስላሙ አለይኩም! እኔ Muslim AI ነኝ። እንዴት ልረዳዎት እችላለሁ?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="ጥያቄዎን ይጻፉ..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">ላክ</button>
        </div>
    </div>

    <footer>Made with ❤️ for the Ummah</footer>

    <script>
        const translations = {
            am: {
                subtitle: "እስላማዊ AI በአማርኛ፣ አፋን ኦሮሞ እና ዐረብኛ",
                welcome: "አስላሙ አለይኩም! እኔ Muslim AI ነኝ። እንዴት ልረዳዎት እችላለሁ?",
                placeholder: "ጥያቄዎን ይጻፉ...",
                send: "ላክ"
            },
            om: {
                subtitle: "AI Islaamaa Afaan Oromoo, Amaariffaa fi Araabiffaan",
                welcome: "Assalamu Alaikum! Ani Muslim AI dha. Akkam si gargaaruu danda'a?",
                placeholder: "Gaaffii kee barreessi...",
                send: "Ergi"
            },
            ar: {
                subtitle: "ذكاء اصطناعي إسلامي بالعربية والأمهرية والأورومو",
                welcome: "السلام عليكم! أنا مسلم AI. كيف يمكنني مساعدتك؟",
                placeholder: "اكتب سؤالك...",
                send: "إرسال"
            }
        };

        let currentLang = 'am';

        function changeLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('subtitle').textContent = translations[lang].subtitle;
            document.getElementById('welcome').textContent = translations[lang].welcome;
            document.getElementById('userInput').placeholder = translations[lang].placeholder;
            document.getElementById('sendBtn').textContent = translations[lang].send;
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const messages = document.getElementById('messages');
            
            // User message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            messages.appendChild(userMsg);

            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            // Bot reply (temporary simple reply)
            setTimeout(() => {
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';
                
                if (currentLang === 'am') {
                    botMsg.textContent = "ጉዳዩን ተረድቻለሁ። በቅርብ ጊዜ ሙሉ AI ምላሽ ይኖረዋል። አሁን ግን እየተዘጋጀ ነው።";
                } else if (currentLang === 'om') {
                    botMsg.textContent = "Gaaffii kee dhaga'eera. Dhihoo keessa deebii guutuu AI ni argatta. Amma qophaa'aa jira.";
                } else {
                    botMsg.textContent = "فهمت سؤالك. قريبًا سيكون هناك رد كامل من الذكاء الاصطناعي. يتم التحضير الآن.";
                }
                
                messages.appendChild(botMsg);
                messages.scrollTop = messages.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>
