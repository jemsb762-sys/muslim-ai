
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#063b2b">
<title>Muslim AI | إسلامي AI</title>
<meta name="description" content="Islamic AI assistant in Amharic, Afaan Oromoo and Arabic">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Arial, "Segoe UI", sans-serif;
  background: linear-gradient(135deg,#063b2b,#126b4b);
  color: white;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  text-align: center;
  padding: 20px 15px;
  background: rgba(0,0,0,.2);
}

.bismillah {
  font-size: 27px;
  color: #f1d58a;
  margin-bottom: 12px;
}

h1 { font-size: 32px; }

.subtitle {
  margin-top: 8px;
  opacity: .85;
  font-size: 16px;
}

.languages {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.lang-btn {
  border: 0;
  padding: 11px 18px;
  border-radius: 25px;
  background: rgba(255,255,255,.15);
  color: white;
  cursor: pointer;
  font-size: 15px;
}

.lang-btn.active { background: #2e8b63; }

.chat-container {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 15px;
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 60vh;
}

.messages {
  flex: 1;
  min-height: 350px;
  max-height: 65vh;
  overflow-y: auto;
  padding: 18px;
  border-radius: 20px;
  background: rgba(255,255,255,.06);
}

.message {
  max-width: 88%;
  padding: 13px 16px;
  margin-bottom: 13px;
  border-radius: 17px;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.bot { background: rgba(46,139,99,.65); }
.user {
  background: rgba(255,255,255,.17);
  margin-left: auto;
}

.input-area {
  display: flex;
  gap: 10px;
  margin-top: 15px;
  align-items: center;
}

#userInput {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  border-radius: 30px;
  padding: 16px 20px;
  font-size: 16px;
  background: white;
  color: #222;
}

#sendBtn {
  border: 0;
  border-radius: 30px;
  padding: 15px 24px;
  background: #2e8b63;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#sendBtn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.typing { opacity: .7; font-style: italic; }

footer {
  text-align: center;
  padding: 20px 10px;
  opacity: .7;
  font-size: 14px;
}

@media(max-width:480px) {
  h1 { font-size: 29px; }
  .bismillah { font-size: 23px; }
  .chat-container { padding: 12px; }
  .messages { padding: 13px; }
  .message { max-width: 94%; }
  #sendBtn { padding: 14px 19px; }
}
</style>
</head>

<body>

<header>
  <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
  <h1>Muslim AI</h1>
  <p class="subtitle" id="subtitle">
    እስላማዊ AI በአማርኛ፣ አፋን ኦሮሞ እና ዐረብኛ
  </p>

  <div class="languages">
    <button class="lang-btn active" onclick="changeLang('am',this)">አማርኛ</button>
    <button class="lang-btn" onclick="changeLang('om',this)">Afaan Oromoo</button>
    <button class="lang-btn" onclick="changeLang('ar',this)">العربية</button>
  </div>
</header>

<main class="chat-container">
  <div class="messages" id="messages" aria-live="polite">
    <div class="message bot" id="welcome">
      አስላሙ አለይኩም! እኔ Muslim AI ነኝ።
      የእስልምና ጥያቄዎን ይጠይቁኝ።
    </div>
  </div>

  <div class="input-area">
    <input
      id="userInput"
      type="text"
      placeholder="ጥያቄዎን ይጻፉ..."
      autocomplete="off"
      maxlength="4000"
      aria-label="Your question"
    >
    <button id="sendBtn" type="button">ላክ</button>
  </div>
</main>

<footer>Muslim AI — Made for the Ummah ❤️</footer>

<script>
/* Replace this with your actual Vercel deployment URL */
const API_URL = "https://YOUR-PROJECT.vercel.app/api/chat";

const translations = {
  am: {
    subtitle: "እስላማዊ AI በአማርኛ፣ አፋን ኦሮሞ እና ዐረብኛ",
    welcome: "አስላሙ አለይኩም! እኔ Muslim AI ነኝ። የእስልምና ጥያቄዎን ይጠይቁኝ።",
    placeholder: "ጥያቄዎን ይጻፉ...",
    send: "ላክ",
    typing: "መልስ እያዘጋጀሁ ነው...",
    network: "የኔትወርክ ችግር አለ። እባክዎ እንደገና ይሞክሩ።",
    error: "መልስ ማግኘት አልተቻለም።",
    empty: "እባክዎ ጥያቄ ያስገቡ።"
  },
  om: {
    subtitle: "AI Islaamaa Afaan Oromoo, Amaariffaa fi Arabiffaan",
    welcome: "Assalaamu Alaikum! Ani Muslim AI dha. Gaaffii Islaamaa kee na gaafadhu.",
    placeholder: "Gaaffii kee barreessi...",
    send: "Ergi",
    typing: "Deebii qopheessaa jira...",
    network: "Rakkoon network jira. Maaloo irra deebi'ii yaali.",
    error: "Deebii argachuun hin danda'amne.",
    empty: "Maaloo gaaffii kee galchi."
  },
  ar: {
    subtitle: "ذكاء اصطناعي إسلامي بالعربية والأمهرية والأورومو",
    welcome: "السلام عليكم! أنا مسلم AI. اسألني عن الإسلام.",
    placeholder: "اكتب سؤالك...",
    send: "إرسال",
    typing: "جارٍ إعداد الإجابة...",
    network: "مشكلة في الاتصال. يرجى المحاولة مرة أخرى.",
    error: "تعذر الحصول على إجابة.",
    empty: "يرجى كتابة سؤالك."
  }
};

let currentLang = "am";

function changeLang(lang, button) {
  currentLang = lang;
  document.querySelectorAll(".lang-btn").forEach(btn =>
    btn.classList.remove("active")
  );
  button.classList.add("active");

  document.getElementById("subtitle").textContent =
    translations[lang].subtitle;
  document.getElementById("welcome").textContent =
    translations[lang].welcome;
  document.getElementById("userInput").placeholder =
    translations[lang].placeholder;
  document.getElementById("sendBtn").textContent =
    translations[lang].send;

  document.documentElement.lang = lang === "om" ? "om" : lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
}

function addMessage(text, type) {
  const messages = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function sendMessage() {
  const input = document.getElementById("userInput");
  const send = document.getElementById("sendBtn");
  const text = input.value.trim();
  const t = translations[currentLang];

  if (!text) {
    input.placeholder = t.empty;
    return;
  }

  if (API_URL.includes("YOUR-PROJECT")) {
    addMessage("Please configure your Vercel API URL first.", "bot");
    return;
  }

  addMessage(text, "user");
  input.value = "";
  send.disabled = true;

  const typing = addMessage(t.typing, "bot typing");

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        language: currentLang
      })
    });

    const data = await response.json();
    typing.remove();

    if (!response.ok) {
      addMessage(data.error || t.error, "bot");
    } else {
      addMessage(data.reply || t.error, "bot");
    }
  } catch (error) {
    typing.remove();
    addMessage(t.network, "bot");
    console.error("Chat request failed:", error);
  } finally {
    send.disabled = false;
    input.focus();
    document.getElementById("messages").scrollTop =
      document.getElementById("messages").scrollHeight;
  }
}

document.getElementById("sendBtn").addEventListener("click", sendMessage);

document.getElementById("userInput").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
