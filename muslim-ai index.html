<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muslim AI | እስላማዊ AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f3d2e, #1a5c40);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 700px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            font-size: 2.4rem;
            margin-bottom: 10px;
            color: #f0e6d2;
        }
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .languages {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .lang {
            background: rgba(255,255,255,0.15);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.95rem;
        }
        .bismillah {
            font-size: 1.4rem;
            margin: 20px 0;
            color: #e8d5a3;
            font-family: 'Amiri', serif;
        }
        .coming-soon {
            background: #2e7d5a;
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 1.1rem;
            display: inline-block;
            margin-top: 10px;
        }
        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
        
        <h1>Muslim AI</h1>
        <p class="subtitle">
            እስላማዊ AI በአማርኛ፣ በአፋን ኦሮሞ እና በዐረብኛ<br>
            Islamic AI in Amharic, Afaan Oromo & Arabic
        </p>

        <div class="languages">
            <span class="lang">አማርኛ</span>
            <span class="lang">Afaan Oromo</span>
            <span class="lang">العربية</span>
        </div>

        <div class="coming-soon">በቅርብ ጊዜ ይመጣል • Coming Soon</div>
    </div>

    <footer>
        Made with ❤️ for the Ummah
    </footer>
</body>
</html>
